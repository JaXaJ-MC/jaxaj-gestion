name: Vérification et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # relancer à la main depuis l'onglet Actions

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npx oxlint src
      - run: npm run build   # vérification TypeScript puis construction

  # Déploiement sur la Dédibox : seulement depuis main, une fois les tests passés. La clé
  # DEDIBOX_CLE ne peut lancer que jaxaj-deployer (commande forcée côté serveur) ; DEDIBOX_HOTE
  # est l'empreinte du serveur, vérifiée avant toute connexion.
  deploiement:
    needs: verification
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: deploiement-gestion, cancel-in-progress: false }
    steps:
      - name: Déployer sur la Dédibox
        env:
          CLE: ${{ secrets.DEDIBOX_CLE }}
          HOTE: ${{ secrets.DEDIBOX_HOTE }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploiement && chmod 600 ~/.ssh/deploiement
          printf '%s\n' "$HOTE" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploiement -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes jaxaj@51.159.2.167 gestion
